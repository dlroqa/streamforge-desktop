# electron-builder configuration for StreamForge Desktop.
# Produces installers for macOS (Apple Silicon + Intel), Windows, and Linux
# (Ubuntu 24+). Builds are unsigned by default — see README "Desktop app" for
# code-signing/notarization notes.
appId: dev.streamforge.desktop
productName: StreamForge
copyright: © StreamForge

directories:
  output: release
  buildResources: build

# Ship the built web bundle + the compiled Electron layer. Everything the app
# loads at runtime lives in dist/ (served locally) or electron-dist/ (esbuild
# bundles the main process, with only `electron` left external).
#
# node_modules is excluded deliberately: Vite already inlined every runtime
# dependency into dist/, so packing the dependency tree as well would add
# ~350MB of dead weight (transformers.js, ffmpeg core, pdfjs) to the installer.
files:
  - dist/**/*
  - electron-dist/**/*
  - package.json
  - "!node_modules/**/*"

# Do not pull the whole dev dependency tree into the asar.
npmRebuild: false
asar: true

mac:
  category: public.app-category.video
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Hardened runtime + entitlements so camera/mic/screen work once signed.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: StreamForge needs your camera to include you in your stream.
    NSMicrophoneUsageDescription: StreamForge needs your microphone to capture audio for your stream.

dmg:
  title: ${productName}

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  icon: build/icon.png
  category: AudioVideo
  synopsis: Live streaming studio — multistream, guests, overlays, editor.
  description: >-
    StreamForge is a live streaming studio: multistream to YouTube, Twitch,
    Facebook and custom RTMP with guests, overlays, unified chat, an in-app
    video editor and an on-device teleprompter.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

deb:
  # Required by the .deb packager (falls back to package.json author otherwise).
  maintainer: dlroqa <eddelaroca@gmail.com>
  # WebRTC/GTK runtime bits that the system webview stack expects.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0
