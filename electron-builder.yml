# electron-builder configuration for StreamForge Desktop.
# Produces installers for macOS (Apple Silicon + Intel), Windows, and Linux
# (Ubuntu 24+). Builds are unsigned by default — see README "Desktop app" for
# code-signing/notarization notes.
appId: dev.streamforge.desktop
productName: StreamForge
copyright: © StreamForge

directories:
  output: release
  buildResources: build

# Ad-hoc signs the macOS bundle (no-op on Windows/Linux) so unsigned arm64
# builds are launchable. See electron/afterPack.cjs.
afterPack: electron/afterPack.cjs

# Ship the built web bundle + the compiled Electron layer. Everything the app
# loads at runtime lives in dist/ (served locally) or electron-dist/ (esbuild
# bundles the main process, with only `electron` left external).
#
# node_modules is excluded deliberately: Vite already inlined every runtime
# dependency into dist/, so packing the dependency tree as well would add
# ~350MB of dead weight (transformers.js, ffmpeg core, pdfjs) to the installer.
files:
  - dist/**/*
  - electron-dist/**/*
  - package.json
  - "!node_modules/**/*"

# Do not pull the whole dev dependency tree into the asar.
npmRebuild: false
asar: true

mac:
  category: public.app-category.video
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # No Apple Developer certificate: `identity: null` stops electron-builder from
  # hunting for one (an absent cert previously failed the whole build). The
  # afterPack hook then ad-hoc signs the bundle, which Apple Silicon requires in
  # order to launch it at all. To ship a properly signed + notarized build, drop
  # this line, add the CSC_*/APPLE_* secrets, and re-enable them in the workflow.
  identity: null
  # Only applied when signing with a real certificate; inert for ad-hoc builds,
  # kept so notarization works the moment a certificate is added.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: StreamForge needs your camera to include you in your stream.
    NSMicrophoneUsageDescription: StreamForge needs your microphone to capture audio for your stream.

dmg:
  # The volume name must be unique per architecture. electron-builder builds the
  # arm64 and x64 dmgs concurrently, and with a shared title both mount at
  # /Volumes/StreamForge — so each one's `hdiutil detach` tears down the other's
  # volume and the second dmg fails ("unable to execute hdiutil ... Exit code: 3").
  title: ${productName} ${arch}

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  icon: build/icon.png
  category: AudioVideo
  synopsis: Live streaming studio — multistream, guests, overlays, editor.
  description: >-
    StreamForge is a live streaming studio: multistream to YouTube, Twitch,
    Facebook and custom RTMP with guests, overlays, unified chat, an in-app
    video editor and an on-device teleprompter.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

deb:
  # Required by the .deb packager (falls back to package.json author otherwise).
  maintainer: dlroqa <eddelaroca@gmail.com>
  # WebRTC/GTK runtime bits that the system webview stack expects.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0
