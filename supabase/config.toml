[functions.admin-api]
verify_jwt = false

# Manual Bearer check inside; exchanges Freesound OAuth codes for tokens.
[functions.freesound-auth]
verify_jwt = false

# Manual Bearer check inside; exchanges/refreshes Google Drive OAuth tokens so
# users can store their files in their own Drive.
[functions.google-drive-auth]
verify_jwt = false

# "UPDATE SYSTEM": copies the admin account's shared settings onto all other
# accounts. Caller JWT is verified manually and gated to the admin's email.
[functions.sync-system]
verify_jwt = false

# Manual Bearer check inside; one-click Livepush OAuth — links the user's own
# Livepush account and returns their per-stream RTMP ingest (Universal Output).
[functions.livepush-connect]
verify_jwt = false
