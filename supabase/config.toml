verify_jwt = false

[functions.manage-destinations]
verify_jwt = false

[functions.trigger-scheduled-streams]
verify_jwt = false

[functions.viewer-analytics]
verify_jwt = false

# Admin panel: own credential system (admin_accounts + x-admin-token sessions),
