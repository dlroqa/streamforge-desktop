<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  [data-composition-id="mg"] {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    font-family: "Archivo", "Helvetica Neue", sans-serif;
    --accent: #06b4e0;
  }

  .scene {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    width: 100%; height: 100%; padding: 120px;
    gap: 28px; box-sizing: border-box; text-align: center;
  }
  .headline {
    font-size: 128px; font-weight: 800; line-height: 1.05;
    letter-spacing: -0.02em; color: #ffffff; margin: 0;
    text-shadow: 0 4px 32px rgba(0,0,0,0.45);
    max-width: 90%;
  }
  .headline .w { display: inline-block; }
  .subtitle {
    font-size: 44px; font-weight: 500; margin: 0;
    color: var(--accent); letter-spacing: 0.04em;
    text-shadow: 0 2px 16px rgba(0,0,0,0.45);
  }
  .rule { width: 120px; height: 6px;
    background: var(--accent); border-radius: 3px; }
</style>
</head>
<body>
<div data-composition-id="mg" data-width="1920" data-height="1080"
     data-start="0" data-duration="5" data-track-index="0">
  <div class="scene">
    <h1 class="headline"><span class="w">Big</span> <span class="w">Summer</span> <span class="w">Sale</span></h1>
    <div class="rule"></div>
    <p class="subtitle">50% off everything</p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  const D = 5;
  const tl = gsap.timeline({ paused: true });
  tl.from(".headline .w", { y: 90, opacity: 0, duration: 0.7, ease: "power3.out", stagger: 0.09 }, 0.2);
  tl.from(".rule", { scaleX: 0, duration: 0.5, ease: "expo.out" }, 0.6);
  tl.from(".subtitle", { y: 30, opacity: 0, duration: 0.55, ease: "power2.out" }, 0.75);
  tl.to(".scene", { y: -40, opacity: 0, duration: 0.5, ease: "power2.in" }, D - 0.6);
  window.__timelines["mg"] = tl;
</script>
</body>
</html>
