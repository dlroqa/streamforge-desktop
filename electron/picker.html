<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline';"
    />
    <title>Choose what to share</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0f17;
        --panel: #161a26;
        --panel-hover: #1e2333;
        --border: #2a2f42;
        --accent: #6366f1;
        --text: #e7e9ef;
        --muted: #9aa0b4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 16px 20px 8px;
      }
      header h1 { font-size: 15px; font-weight: 600; margin: 0; }
      header p { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
      .tabs { display: flex; gap: 6px; padding: 8px 20px 0; }
      .tab {
        font-size: 12px; font-weight: 500; color: var(--muted);
        background: none; border: none; cursor: pointer;
        padding: 6px 12px; border-radius: 8px 8px 0 0;
      }
      .tab.active { color: var(--text); background: var(--panel); }
      main {
        flex: 1; overflow-y: auto; padding: 12px 20px;
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        align-content: start;
      }
      .card {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 10px; overflow: hidden; cursor: pointer;
        transition: border-color .12s, background .12s; text-align: left;
        padding: 0; color: inherit; font: inherit;
      }
      .card:hover { background: var(--panel-hover); border-color: var(--accent); }
      .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .thumb {
        width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
        background: #000; display: block;
      }
      .meta { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
      .meta img { width: 16px; height: 16px; border-radius: 3px; flex: none; }
      .meta span {
        font-size: 12px; white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis;
      }
      footer {
        padding: 12px 20px; border-top: 1px solid var(--border);
        display: flex; justify-content: flex-end; gap: 10px;
      }
      button.action {
        font-size: 13px; font-weight: 500; padding: 8px 16px;
        border-radius: 8px; cursor: pointer; border: 1px solid var(--border);
        background: var(--panel); color: var(--text);
      }
      button.action:hover { background: var(--panel-hover); }
      .empty { grid-column: 1 / -1; color: var(--muted); font-size: 13px; padding: 24px; text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <h1>Choose what to share</h1>
      <p>Select a screen or window for StreamForge to capture.</p>
    </header>
    <div class="tabs">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="screen">Screens</button>
      <button class="tab" data-filter="window">Windows</button>
    </div>
    <main id="grid"></main>
    <footer>
      <button class="action" id="cancel">Cancel</button>
    </footer>

    <script>
      const grid = document.getElementById("grid");
      let all = [];
      let filter = "all";

      // A screen source id looks like "screen:0:0"; window ids are "window:...".
      const kindOf = (id) => (id.startsWith("screen") ? "screen" : "window");

      function render() {
        const items = all.filter((s) => filter === "all" || kindOf(s.id) === filter);
        grid.innerHTML = "";
        if (!items.length) {
          const e = document.createElement("div");
          e.className = "empty";
          e.textContent = "No shareable sources found.";
          grid.appendChild(e);
          return;
        }
        for (const s of items) {
          const card = document.createElement("button");
          card.className = "card";
          card.title = s.name;
          card.onclick = () => window.sharePicker.choose(s.id);

          const img = document.createElement("img");
          img.className = "thumb";
          img.src = s.thumbnail;
          card.appendChild(img);

          const meta = document.createElement("div");
          meta.className = "meta";
          if (s.appIcon) {
            const icon = document.createElement("img");
            icon.src = s.appIcon;
            meta.appendChild(icon);
          }
          const label = document.createElement("span");
          label.textContent = s.name;
          meta.appendChild(label);
          card.appendChild(meta);

          grid.appendChild(card);
        }
      }

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.onclick = () => {
          document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          filter = tab.dataset.filter;
          render();
        };
      });

      document.getElementById("cancel").onclick = () => window.close();
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") window.close();
      });

      window.sharePicker.onSources((sources) => {
        all = sources;
        render();
      });
      window.sharePicker.ready();
    </script>
  </body>
</html>
