# Builds StreamForge Desktop installers for all three platforms on native
# runners. Cross-building is not possible from one machine: Windows NSIS needs
# wine and the macOS dmg needs the darwin-only `dmg-license`, so each target is
# built on its own OS.
#
#   • Push a tag (v1.0.0)  → builds all three + attaches them to a GitHub Release
#   • Run manually         → builds all three and uploads them as artifacts
name: Build desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release on tag builds

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact: macOS
          - os: windows-latest
            platform: win
            artifact: Windows
          - os: ubuntu-latest
            platform: linux
            artifact: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle + Electron layer
        run: npm run build && npm run electron:build

      # electron-builder publishes to the tag's Release when GH_TOKEN is set and
      # the ref is a tag; otherwise it just writes to release/.
      - name: Package ${{ matrix.artifact }}
        run: npx electron-builder --${{ matrix.platform }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing: add these repo secrets to ship signed builds.
          # macOS:   CSC_LINK (base64 .p12), CSC_KEY_PASSWORD,
          #          APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
          # Windows: CSC_LINK / CSC_KEY_PASSWORD
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: StreamForge-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
