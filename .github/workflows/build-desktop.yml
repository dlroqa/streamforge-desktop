# Builds StreamForge Desktop installers for all three platforms on native
# runners. Cross-building is not possible from one machine: Windows NSIS needs
# wine and the macOS dmg needs the darwin-only `dmg-license`, so each target is
# built on its own OS.
#
#   • Push a tag (v1.0.0)  → builds all three + attaches them to a GitHub Release
#   • Run manually         → builds all three and uploads them as artifacts
name: Build desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release on tag builds

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact: macOS
          - os: windows-latest
            platform: win
            artifact: Windows
          - os: ubuntu-latest
            platform: linux
            artifact: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Fail fast with a readable message instead of letting electron-builder
      # die halfway through a tag build with a 404 from the releases repo.
      - name: Check publish credentials
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ -z "${{ secrets.RELEASES_TOKEN }}" ]; then
            echo "::error::RELEASES_TOKEN secret is not set. Create a PAT with" \
                 "'contents: write' on dlroqa/streamforge-releases and add it:" \
                 "gh secret set RELEASES_TOKEN --repo dlroqa/streamforge-desktop"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle + Electron layer
        run: npm run build && npm run electron:build

      # electron-builder publishes to the tag's Release when GH_TOKEN is set and
      # the ref is a tag; otherwise it just writes to release/.
      - name: Package ${{ matrix.artifact }}
        run: npx electron-builder --${{ matrix.platform }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          # Publishes to the PUBLIC dlroqa/streamforge-releases repo (target set
          # in electron-builder.yml), so the shipped updater can read releases
          # without credentials. The built-in GITHUB_TOKEN is scoped to THIS
          # repo only and cannot write to another one, so a PAT with
          # `contents: write` on streamforge-releases is required.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Builds are unsigned. Do NOT reintroduce `CSC_LINK: ${{ secrets.CSC_LINK }}`
          # here while that secret is unset: an undefined secret expands to an
          # empty string, and electron-builder reads CSC_LINK as a *path to a
          # certificate*, so it tries to open the empty path and fails the build
          # with "<workspace> not a file".
          #
          # To ship signed + notarized builds: add the CSC_LINK (base64 .p12),
          # CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
          # APPLE_TEAM_ID secrets, map them here, drop CSC_IDENTITY_AUTO_DISCOVERY
          # below, and remove `identity: null` from electron-builder.yml.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: StreamForge-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
